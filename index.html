<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Record Breakers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#132146;
  --navy-light:#1c2f5e;
  --navy-lighter:#28407a;
  --gold:#f4b942;
  --gold-dark:#d99b1f;
  --coral:#ff6f61;
  --coral-dark:#e6564a;
  --teal:#2ec4b6;
  --cream:#fffaf0;
  --ink:#1a1a2e;
  --green:#3ecf6a;
  --red:#ff5c5c;
  --shadow: 0 8px 24px rgba(0,0,0,0.25);
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;height:100%;width:100%;
  font-family:'Poppins',sans-serif;
  background:var(--navy);
  color:var(--ink);
  overflow:hidden;
}
#app{
  position:fixed;inset:0;
  width:100%;height:100%;
  background:radial-gradient(circle at 50% 0%, var(--navy-lighter) 0%, var(--navy) 65%);
  overflow:hidden;
}
.screen{
  position:absolute;inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding:20px 16px 40px;
}
.screen.active{display:flex;}
.screen-inner{
  width:100%;
  max-width:clamp(460px, 62vw, 820px);
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0 auto;
}
h1,h2,h3{margin:0;color:var(--cream);}
p{margin:0;}
button{
  font-family:'Poppins',sans-serif;
  cursor:pointer;
  border:none;
  outline:none;
}
.btn{
  background:var(--gold);
  color:var(--navy);
  font-weight:700;
  font-size:clamp(17px, 1.9vw, 24px);
  padding:clamp(14px, 1.6vw, 20px) clamp(28px, 3vw, 40px);
  border-radius:14px;
  box-shadow:0 4px 0 var(--gold-dark);
  transition:transform 0.08s ease;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dark);}
.btn.secondary{
  background:transparent;
  color:var(--cream);
  border:2px solid rgba(255,255,255,0.35);
  box-shadow:none;
  font-weight:600;
}
.btn.secondary:active{transform:translateY(2px);}
.btn.coral{
  background:var(--coral);
  color:#fff;
  box-shadow:0 4px 0 var(--coral-dark);
}
.btn.coral:active{box-shadow:0 1px 0 var(--coral-dark);}
.btn:disabled{opacity:0.4;pointer-events:none;}

/* ---------- Title screen ---------- */
#screen-title .screen-inner{justify-content:center;height:100%;text-align:center;gap:18px;}
.title-emoji{font-size:64px;line-height:1;}
.title-name{
  font-size:clamp(38px, 4.2vw, 56px);font-weight:800;color:var(--gold);
  text-shadow:0 3px 0 var(--navy);
  letter-spacing:0.5px;
}
.title-sub{color:var(--cream);opacity:0.85;font-size:clamp(15px, 1.7vw, 20px);max-width:440px;}
.title-buttons{display:flex;flex-direction:column;gap:12px;margin-top:14px;width:100%;max-width:340px;}

/* ---------- Tutorial ---------- */
.tut-card{
  background:var(--cream);
  border-radius:20px;
  padding:26px 22px;
  width:100%;
  box-shadow:var(--shadow);
  text-align:center;
  margin-top:30px;
}
.tut-emoji{font-size:52px;margin-bottom:10px;}
.tut-title{font-size:21px;font-weight:700;color:var(--navy);margin-bottom:10px;}
.tut-body{font-size:15px;color:#333;line-height:1.5;}
.tut-nav{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:20px;}
.tut-dots{display:flex;gap:6px;}
.tut-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3);}
.tut-dot.active{background:var(--gold);}

/* ---------- Hub ---------- */
#screen-hub .screen-inner{padding-top:10px;gap:16px;}
.hub-header{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.hub-title{font-size:clamp(22px, 2.5vw, 30px);font-weight:800;color:var(--gold);}
.hub-book-btn{
  background:var(--navy-light);
  border:2px solid var(--gold);
  color:var(--cream);
  border-radius:12px;
  padding:clamp(8px, 1vw, 12px) clamp(12px, 1.4vw, 18px);
  font-size:clamp(13px, 1.4vw, 16px);
  font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.booth-grid{display:flex;flex-direction:column;gap:12px;width:100%;}
.booth-card{
  background:var(--navy-light);
  border-radius:16px;
  padding:clamp(16px, 1.8vw, 22px);
  display:flex;
  align-items:center;
  gap:14px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
  position:relative;
}
.booth-card.locked{opacity:0.45;}
.booth-card.done{border-color:var(--green);}
.booth-icon{
  font-size:clamp(34px, 3.8vw, 46px);
  width:clamp(56px, 6.2vw, 76px);height:clamp(56px, 6.2vw, 76px);
  display:flex;align-items:center;justify-content:center;
  background:var(--navy);
  border-radius:14px;
  flex-shrink:0;
}
.booth-info{flex:1;min-width:0;}
.booth-name{color:var(--cream);font-weight:700;font-size:clamp(16px, 1.8vw, 21px);}
.booth-desc{color:rgba(255,250,240,0.65);font-size:clamp(12px, 1.4vw, 15px);margin-top:2px;}
.booth-progress{display:flex;gap:3px;margin-top:6px;}
.stamp{
  width:20px;height:20px;
  border-radius:50%;
  border:2px dashed rgba(255,255,255,0.35);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;
  color:transparent;
  flex-shrink:0;
}
.stamp.filled{
  border:2px solid #C0453A;
  color:#C0453A;
  background:rgba(192,69,58,0.12);
  transform:rotate(-8deg);
}
.booth-lock-icon{font-size:22px;color:rgba(255,255,255,0.6);}
.booth-check{font-size:26px;color:var(--green);}

/* ---------- Booth intro ---------- */
.booth-intro-card{
  background:var(--navy-light);
  border-radius:20px;
  padding:28px 22px;
  text-align:center;
  width:100%;
  margin-top:20px;
  box-shadow:var(--shadow);
}
.booth-intro-emoji{font-size:56px;}
.booth-intro-title{color:var(--gold);font-size:22px;font-weight:800;margin-top:8px;}
.booth-intro-desc{color:var(--cream);opacity:0.85;font-size:14px;margin-top:10px;line-height:1.5;}

/* ---------- Play screen ---------- */
#screen-play .screen-inner{padding-top:6px;gap:12px;}
.play-topbar{width:100%;display:flex;align-items:center;gap:10px;}
.play-main-row{display:flex;align-items:flex-start;gap:clamp(10px, 1.6vw, 20px);width:100%;}
.play-progressbar{flex:1;height:clamp(10px, 1.1vw, 14px);background:rgba(255,255,255,0.15);border-radius:6px;overflow:hidden;}
.play-progressfill{height:100%;background:var(--gold);border-radius:6px;transition:width 0.3s ease;}
.play-exit{color:var(--cream);opacity:0.7;font-size:clamp(20px, 2.2vw, 26px);background:none;padding:4px 8px;}
.record-badge{
  background:var(--navy-light);
  color:var(--cream);
  font-size:clamp(12px, 1.3vw, 15px);
  font-weight:600;
  border-radius:10px;
  padding:clamp(8px, 1vw, 12px) clamp(12px, 1.3vw, 16px);
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}
.question-card{
  background:var(--cream);
  border-radius:20px;
  padding:clamp(18px, 2.4vw, 34px) clamp(14px, 2vw, 28px);
  flex:1;
  min-width:0;
  box-shadow:var(--shadow);
  text-align:center;
}
.q-context{font-size:clamp(13px, 1.5vw, 17px);color:#666;font-weight:600;margin-bottom:8px;}
.q-prompt{font-size:clamp(17px, 2.1vw, 25px);color:var(--ink);font-weight:600;line-height:1.4;margin-bottom:14px;}
.q-visual{margin:10px 0 16px;}
.q-fraction-display{
  display:inline-flex;flex-direction:column;align-items:center;
  font-size:clamp(22px, 3vw, 36px);font-weight:700;line-height:1.05;
  margin:0 clamp(4px, 0.9vw, 10px);
}
.q-fraction-display .num{border-bottom:2.5px solid var(--ink);padding:0 6px 2px;}
.q-fraction-display .den{padding:2px 6px 0;}
.q-mixed-whole{font-size:clamp(26px, 3.6vw, 44px);font-weight:800;margin-right:4px;}
.q-compare-row{display:flex;align-items:center;justify-content:center;gap:clamp(4px, 1.2vw, 14px);flex-wrap:wrap;font-size:clamp(22px, 3vw, 36px);font-weight:700;}
.q-op{font-size:clamp(24px, 3.2vw, 38px);font-weight:800;color:var(--coral-dark);margin:0 6px;}

.answer-area{margin-top:6px;}
.compare-buttons{display:flex;gap:10px;justify-content:center;}
.compare-btn{
  width:64px;height:64px;
  border-radius:16px;
  background:var(--navy-light);
  color:var(--cream);
  font-size:26px;
  font-weight:800;
  box-shadow:0 4px 0 rgba(0,0,0,0.3);
}
.compare-btn:active{transform:translateY(3px);box-shadow:none;}
.compare-btn.selected{background:var(--gold);color:var(--navy);}

.symbol-circle-wrap{display:flex;justify-content:center;margin:4px 0;}
.symbol-circle{
  width:clamp(72px, 8vw, 100px);height:clamp(72px, 8vw, 100px);
  border-radius:50%;
  background:#fff;
  border:3px dashed #bbb;
  color:#999;
  font-size:clamp(30px, 3.4vw, 42px);
  font-weight:800;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(0,0,0,0.08);
  transition:transform 0.08s ease;
}
.symbol-circle:active{transform:scale(0.94);}
.symbol-circle.chosen{
  border:3px solid var(--gold-dark);
  color:var(--navy);
  background:#fff8e6;
}

.symbol-picker-overlay{
  position:absolute;inset:0;
  background:rgba(10,14,30,0.6);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:70;
  padding:0;
}
.symbol-picker-overlay.active{display:flex;}
.symbol-picker-card{
  background:var(--cream);
  border-radius:24px 24px 0 0;
  padding:clamp(26px, 2.8vw, 38px) clamp(24px, 2.6vw, 36px) clamp(34px, 3.6vw, 48px);
  width:100%;
  max-width:560px;
  text-align:center;
  box-shadow:0 -8px 30px rgba(0,0,0,0.4);
  animation:sheetUp 0.22s ease;
}
@keyframes sheetUp{
  from{transform:translateY(100%);}
  to{transform:translateY(0);}
}
.symbol-picker-title{font-weight:700;color:var(--navy);font-size:clamp(16px, 1.8vw, 21px);margin-bottom:18px;}
.symbol-picker-buttons{display:flex;gap:16px;justify-content:center;}
.symbol-picker-btn{
  width:clamp(76px, 8.4vw, 104px);height:clamp(76px, 8.4vw, 104px);
  border-radius:50%;
  background:var(--navy-light);
  color:var(--cream);
  font-size:clamp(30px, 3.4vw, 42px);
  font-weight:800;
  box-shadow:0 4px 0 rgba(0,0,0,0.3);
}
.symbol-picker-btn:active{transform:translateY(3px);box-shadow:none;}

.mixed-input-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
.mn-whole-wrap{display:flex;flex-direction:column;align-items:center;}
.mn-frac-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.num-input{
  width:clamp(56px, 6.2vw, 78px);height:clamp(52px, 5.8vw, 72px);
  border:2px solid #ccc;
  border-radius:10px;
  font-size:clamp(20px, 2.4vw, 28px);
  font-weight:700;
  text-align:center;
  font-family:'Poppins',sans-serif;
  background:#fff;
  color:var(--ink);
}
.num-input:focus{border-color:var(--gold-dark);}
.mn-divider{width:clamp(40px, 4.4vw, 56px);height:2.5px;background:var(--ink);margin:2px 0;}
.mn-label{font-size:clamp(10px, 1.1vw, 13px);color:#888;margin-top:3px;font-weight:600;text-transform:uppercase;}

.single-input-row{display:flex;justify-content:center;}
.single-input{
  width:clamp(120px, 13vw, 165px);height:clamp(56px, 6.2vw, 76px);
  border:2px solid #ccc;
  border-radius:12px;
  font-size:clamp(24px, 2.8vw, 32px);
  font-weight:700;
  text-align:center;
  font-family:'Poppins',sans-serif;
  background:#fff;
  color:var(--ink);
}

.submit-row{margin-top:18px;display:flex;justify-content:center;}

.feedback-banner{
  width:100%;
  border-radius:14px;
  padding:12px 16px;
  text-align:center;
  font-weight:700;
  font-size:15px;
  margin-top:4px;
  display:none;
}
.feedback-banner.correct{background:rgba(62,207,106,0.18);color:#1a7a3a;border:2px solid var(--green);display:block;}
.feedback-banner.incorrect{background:rgba(255,92,92,0.15);color:#b52d2d;border:2px solid var(--red);display:block;}

/* line plot */
.lineplot-wrap{background:#fff;border-radius:14px;padding:14px 10px 10px;margin:10px 0;overflow-x:auto;}
.lineplot-track{position:relative;height:150px;min-width:280px;}
.lineplot-axis{position:absolute;bottom:22px;left:10px;right:10px;height:2px;background:#333;}
.lineplot-tick{position:absolute;bottom:4px;transform:translateX(-50%);font-size:11px;color:#333;font-weight:600;}
.lineplot-tickmark{position:absolute;bottom:20px;width:2px;height:8px;background:#333;transform:translateX(-1px);}
.lineplot-dot{
  position:absolute;
  width:16px;height:16px;
  transform:translate(-50%,0);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--coral-dark);font-weight:800;
}
.lineplot-legend{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid #eee;
}
.lineplot-legend-item{
  background:#f4f4f4;
  border-radius:8px;
  padding:5px 9px;
  font-size:11px;
  display:flex;
  gap:5px;
  align-items:baseline;
}
.ll-name{font-weight:700;color:var(--navy);}
.ll-val{font-weight:600;color:var(--coral-dark);}

/* ---------- Record certified overlay ---------- */
.cert-overlay{
  position:absolute;inset:0;
  background:rgba(10,14,30,0.88);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:20px;
}
.cert-overlay.active{display:flex;}
.cert-card{
  background:linear-gradient(160deg, #fffaf0, #fff2d6);
  border-radius:20px;
  padding:30px 24px;
  text-align:center;
  max-width:340px;
  box-shadow:0 0 0 6px var(--gold), 0 20px 40px rgba(0,0,0,0.4);
  animation:certPop 0.4s ease;
}
@keyframes certPop{
  0%{transform:scale(0.6);opacity:0;}
  70%{transform:scale(1.05);}
  100%{transform:scale(1);opacity:1;}
}
.cert-emoji{font-size:54px;}
.cert-heading{color:var(--gold-dark);font-weight:800;font-size:14px;letter-spacing:1px;text-transform:uppercase;margin-top:6px;}
.cert-name{color:var(--navy);font-weight:800;font-size:19px;margin-top:6px;line-height:1.3;}
.cert-fact{color:#555;font-size:13px;margin-top:8px;line-height:1.4;}
.cert-divider{height:1px;background:#e5ddc8;margin:14px 0 10px;}
.cert-practice-label{color:#999;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.cert-value{color:var(--coral-dark);font-weight:800;font-size:20px;margin-top:6px;}

/* ---------- Booth complete overlay ---------- */
.complete-card{
  background:linear-gradient(160deg, var(--navy-light), var(--navy));
  border-radius:22px;
  padding:34px 24px;
  text-align:center;
  max-width:340px;
  box-shadow:0 0 0 4px var(--gold);
}
.complete-emoji{font-size:60px;}
.complete-title{color:var(--gold);font-weight:800;font-size:22px;margin-top:8px;}
.complete-sub{color:var(--cream);opacity:0.85;font-size:14px;margin-top:8px;}
.complete-stars{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.complete-stamp{width:28px;height:28px;font-size:15px;}

/* ---------- Record Book ---------- */
#screen-book .screen-inner{padding-top:4px;}
.book-header{width:100%;display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.book-back{
  background:var(--navy-light);color:var(--cream);border-radius:10px;
  width:38px;height:38px;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.book-title{color:var(--gold);font-size:20px;font-weight:800;}
.book-empty{color:var(--cream);opacity:0.7;text-align:center;margin-top:60px;font-size:14px;line-height:1.6;}
.book-section-title{color:var(--cream);font-weight:700;font-size:14px;margin:14px 0 8px;width:100%;opacity:0.9;}
.book-list{display:flex;flex-direction:column;gap:10px;width:100%;}
.book-item{
  background:var(--cream);
  border-radius:14px;
  padding:14px 14px;
  display:flex;
  gap:12px;
  align-items:flex-start;
  text-align:left;
  box-shadow:0 3px 10px rgba(0,0,0,0.2);
}
.book-item-emoji{font-size:30px;flex-shrink:0;line-height:1;}
.book-item-text{flex:1;min-width:0;}
.book-item-name{font-size:clamp(14px, 1.5vw, 17px);font-weight:800;color:var(--navy);line-height:1.25;}
.book-item-fact{font-size:clamp(12px, 1.3vw, 14px);color:#555;margin-top:4px;line-height:1.4;}
.book-item-value{font-size:clamp(12px, 1.3vw, 14px);font-weight:700;color:var(--coral-dark);margin-top:6px;}

/* ---------- Finale ---------- */
#screen-finale .screen-inner{justify-content:center;height:100%;text-align:center;gap:16px;}
.finale-emoji{font-size:70px;}
.finale-title{font-size:26px;font-weight:800;color:var(--gold);}
.finale-sub{color:var(--cream);opacity:0.85;font-size:15px;max-width:320px;line-height:1.5;}
.finale-count{color:var(--coral);font-weight:800;font-size:20px;}

/* confetti */
.confetti-piece{
  position:absolute;
  top:-20px;
  width:8px;height:14px;
  opacity:0.9;
  border-radius:2px;
  animation:confettiFall linear forwards;
}
@keyframes confettiFall{
  to{transform:translateY(110vh) rotate(360deg);opacity:0.3;}
}

.mascot-wrap svg{display:block;width:100%;height:100%;}
.mascot-title{width:clamp(120px, 13vw, 190px);height:calc(1.3158 * clamp(120px, 13vw, 190px));margin:0 auto;}
.mascot-hub{width:clamp(56px, 6vw, 84px);height:calc(1.3214 * clamp(56px, 6vw, 84px));flex-shrink:0;}
.hub-mascot-row{display:flex;align-items:center;gap:10px;}
.hub-title-block{display:flex;flex-direction:column;gap:2px;}
.hub-rank{font-size:clamp(11px, 1.2vw, 15px);color:var(--gold);font-weight:700;opacity:0.9;}
.mascot-play{width:clamp(130px, 15vw, 210px);height:calc(1.3154 * clamp(130px, 15vw, 210px));flex-shrink:0;}
.mascot-play svg{width:100%;height:100%;}
.mascot-cert{width:clamp(90px, 10vw, 140px);height:calc(1.3111 * clamp(90px, 10vw, 140px));margin:0 auto 6px;}
.mascot-complete{width:clamp(100px, 11vw, 155px);height:calc(1.32 * clamp(100px, 11vw, 155px));margin:0 auto 6px;}

/* ---------- Visual Aid Scratchpad (interactive tool) ---------- */
.va-toggle-row{display:flex;justify-content:center;margin-top:16px;}
.va-toggle-btn{
  background:transparent;
  color:var(--navy-light);
  border:2px solid #d8cfb8;
  border-radius:12px;
  padding:8px 16px;
  font-size:clamp(12px, 1.3vw, 15px);
  font-weight:600;
  font-family:'Poppins',sans-serif;
}
.va-toggle-btn:active{transform:translateY(1px);}
.va-panel{
  margin-top:12px;
  background:#fbf6ea;
  border:1.5px solid #e5ddc8;
  border-radius:14px;
  padding:16px 12px 14px;
}
.va-instruction{font-size:clamp(11px, 1.2vw, 13px);color:#8a7f5e;font-weight:600;text-align:center;margin-bottom:12px;line-height:1.4;}

.va-armrow{display:flex;gap:8px;justify-content:center;margin-bottom:4px;flex-wrap:wrap;}
.va-arm-btn{
  background:#fff;
  border:2px solid #ccc;
  border-radius:10px;
  padding:6px 12px;
  font-size:clamp(11px, 1.2vw, 13px);
  font-weight:700;

// FRACTION MATH UTILITIES

function gcd(a, b) {
  a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b));
  while (b) { [a, b] = [b, a % b]; }
  return a || 1;
}
function lcm(a, b) { return Math.abs(a * b) / gcd(a, b); }
function simplify(n, d) {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d);
  return [n / g, d / g];
}
// mixed {w,n,d} -> improper fraction {n,d}
function toImproper(w, n, d) { return [w * d + n, d]; }
// improper n/d -> mixed {w,n,d} (n,d stay as given, not simplified)
function toMixedRaw(n, d) {
  const w = Math.floor(n / d);
  const rem = n - w * d;
  return [w, rem, d];
}
function fracValue(n, d) { return n / d; }
function mixedValue(w, n, d) { return w + n / d; }
// compare two fractions n1/d1 vs n2/d2 -> -1,0,1
function compareFrac(n1, d1, n2, d2) {
  const left = n1 * d2, right = n2 * d1;
  if (left < right) return -1;
  if (left > right) return 1;
  return 0;
}
function addFrac(n1, d1, n2, d2) {
  const L = lcm(d1, d2);
  const n = n1 * (L / d1) + n2 * (L / d2);
  return simplify(n, L);
}
function subFrac(n1, d1, n2, d2) {
  const L = lcm(d1, d2);
  const n = n1 * (L / d1) - n2 * (L / d2);
  return simplify(n, L);
}
function mulFracWhole(n, d, w) { return simplify(n * w, d); }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

// Shuffle-bag picker for REAL_RECORDS so the same record doesn't repeat
// until every record in the pool has been used once.

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {

    [a[i], a[j]] = [a[j], a[i]];

}

  return _recordBag.pop();
}

// format a fraction/mixed value into plain text (for context strings), e.g. "2 3/5" or "3/5"

    n1 = randInt(d1 + 1, d1 * 4); n2 = randInt(d2 + 1, d2 * 4);
  } else if (tier === 5) {
    w1 = w2 = randInt(3, 9);
    d1 = randDen(6, 10); d2 = randDen(6, 12);
    n1 = randInt(1, d1 - 1); n2 = randInt(1, d2 - 1);
  } else {
    w1 = w2 = randInt(1, 7);
    if (Math.random() < 0.5) {
      const baseD = randDen(3, 6), baseN = randInt(1, baseD - 1);
      const mult1 = pick([2, 3]), mult2 = pick([2, 3, 4]);
      n1 = baseN * mult1; d1 = baseD * mult1;
      n2 = baseN * mult2; d2 = baseD * mult2;
    } else {
      d1 = randDen(4, 9); d2 = randDen(4, 9);
      n1 = randInt(1, d1 - 1); n2 = randInt(1, d2 - 1);
    }
  }
  let val1, val2, disp1, disp2;
  if (mode === 'improper') {
    val1 = fracValue(n1, d1); val2 = fracValue(n2, d2);
    disp1 = { w: 0, n: n1, d: d1 }; disp2 = { w: 0, n: n2, d: d2 };
  } else {
    val1 = mixedValue(w1, n1, d1); val2 = mixedValue(w2, n2, d2);
    disp1 = { w: w1, n: n1, d: d1 }; disp2 = { w: w2, n: n2, d: d2 };
  }
  let correct = 'equal';
  if (val1 < val2) correct = 'less';
  else if (val1 > val2) correct = 'greater';
  const relationWord = correct === 'less' ? 'is shorter than' : correct === 'greater' ? 'is longer than' : 'equals';
  return {
    type: 'compare', tier,
    context: `Two scouts measured ${flavor.thing} in ${flavor.unit}.`,
    left: disp1, right: disp2, correct, flavor,
    recordValue: `${formatDisplayFraction(disp1)} ${flavor.unit} ${relationWord} ${formatDisplayFraction(disp2)} ${flavor.unit}`,
  };
}
function formatDisplayFraction(f) {
  if (f.n === 0) return `${f.w}`;
  if (f.w === 0) return `${f.n}/${f.d}`;
  return `${f.w} ${f.n}/${f.d}`;
}

// ---------- CONVERT ----------
function genConvert(tier) {
  const flavor = pickRecord();
  const toMixed = tier % 2 === 1;
  let n, d, w;
  if (tier <= 2) { d = randDen(3, 5); n = randInt(d + 1, d * 3); }
  else if (tier <= 4) { d = randDen(4, 9); n = randInt(d + 1, d * 3); }
  else { d = randDen(5, 12); n = randInt(d + 1, d * 4); }

  if (toMixed) {
    const [rw, rn, rd] = toMixedRaw(n, d);
    return {
      type: 'convert-to-mixed', tier,
      context: `A judge wrote down ${flavor.thing} as an improper fraction.`,
      given: { n, d }, correctValue: mixedValue(rw, rn, rd), flavor,
      recordValue: `${n}/${d} ${flavor.unit} = ${formatMixedText(rw, rn, rd)} ${flavor.unit}`,
    };
  } else {
    w = randInt(1, 9);
    const fracN = randInt(1, d - 1);
    const [impN, impD] = toImproper(w, fracN, d);
    return {
      type: 'convert-to-improper', tier,
      context: `A judge wrote down ${flavor.thing} as a mixed number.`,
      given: { w, n: fracN, d }, correctValue: mixedValue(w, fracN, d), flavor,
      recordValue: `${formatMixedText(w, fracN, d)} ${flavor.unit} = ${impN}/${impD} ${flavor.unit}`,
    };
  }
}

// ---------- ESTIMATE ----------
function genEstimate(tier) {
  const flavor = pickRecord();
  const op = tier % 2 === 1 ? 'add' : 'subtract';
  let w1, n1, d1, w2, n2, d2;
  const sizeRange = tier <= 2 ? [2, 6] : tier <= 4 ? [3, 12] : [5, 20];
  w1 = randInt(sizeRange[0], sizeRange[1]);
  w2 = randInt(sizeRange[0], sizeRange[1]);
  d1 = randDen(4, 10); d2 = randDen(4, 12);
  n1 = randInt(1, d1 - 1); n2 = randInt(1, d2 - 1);
  if (op === 'subtract' && w1 < w2) { [w1, w2] = [w2, w1]; }

  const round1 = Math.round(mixedValue(w1, n1, d1));
  const round2 = Math.round(mixedValue(w2, n2, d2));
  const estimate = op === 'add' ? round1 + round2 : round1 - round2;
  return {
    type: 'estimate', tier,
    context: `Estimate to help judge ${flavor.thing} quickly.`,
    left: { w: w1, n: n1, d: d1 }, right: { w: w2, n: n2, d: d2 }, op,
    correctValue: estimate, tolerance: 1, flavor,
    recordValue: `about ${estimate} ${flavor.unit}`,
  };
}

// ---------- ADD/SUB ----------
function genAddSub(tier) {
  const flavor = pickRecord();
  let w1, n1, d1, w2, n2, d2, op, missing = false;
  if (tier === 1) {
    d1 = d2 = randDen(3, 8); w1 = randInt(1, 6); w2 = randInt(0, 3);
    n1 = randInt(1, d1 - 1); n2 = randInt(1, d1 - 1);
    op = 'add';
  } else if (tier === 2) {
    d1 = d2 = randDen(4, 9); w1 = randInt(4, 10); w2 = randInt(1, 5);
    n1 = randInt(0, d1 - 1); n2 = randInt(0, d1 - 1);
    if (mixedValue(w1, n1, d1) < mixedValue(w2, n2, d2)) { [w1, w2] = [w2, w1]; [n1, n2] = [n2, n1]; }
    op = 'subtract';
  } else if (tier === 3) {
    d1 = randDen(3, 8); w1 = randInt(1, 6); n1 = randInt(1, d1 - 1);
    const targetW = w1 + randInt(1, 4);
    w2 = targetW; n2 = 0; d2 = d1;
    op = 'missing-add'; missing = true;
  } else if (tier === 4) {
    d1 = randDen(4, 8); d2 = randDen(4, 8);
    while (d2 === d1) d2 = randDen(4, 8);
    w1 = randInt(6, 12); w2 = randInt(1, 5);
    n1 = randInt(1, d1 - 1); n2 = randInt(1, d2 - 1);
    if (mixedValue(w1, n1, d1) < mixedValue(w2, n2, d2)) { [w1, n1, d1, w2, n2, d2] = [w2, n2, d2, w1, n1, d1]; }
    op = 'subtract';
  } else if (tier === 5) {
    d1 = randDen(4, 8); d2 = randDen(4, 8);
    while (d2 === d1) d2 = randDen(4, 8);
    w1 = randInt(1, 8); w2 = randInt(1, 8);
    n1 = randInt(1, d1 - 1); n2 = randInt(1, d2 - 1);
    op = 'add';
  } else {
    d1 = randDen(5, 10); d2 = randDen(5, 10);
    while (d2 === d1) d2 = randDen(5, 10);
    w1 = randInt(9, 15); w2 = randInt(1, 7);
    n1 = randInt(1, d1 - 1); n2 = randInt(1, d2 - 1);
    if (mixedValue(w1, n1, d1) < mixedValue(w2, n2, d2)) { [w1, n1, d1, w2, n2, d2] = [w2, n2, d2, w1, n1, d1]; }
    op = 'subtract';
  }

  let correctValue;
  let resultFrac;
  if (op === 'add') {
    correctValue = mixedValue(w1, n1, d1) + mixedValue(w2, n2, d2);
    resultFrac = addFrac(w1 * d1 + n1, d1, w2 * d2 + n2, d2);
  } else if (op === 'subtract') {
    correctValue = mixedValue(w1, n1, d1) - mixedValue(w2, n2, d2);
    resultFrac = subFrac(w1 * d1 + n1, d1, w2 * d2 + n2, d2);
  } else if (op === 'missing-add') {
    correctValue = mixedValue(w2, n2, d2) - mixedValue(w1, n1, d1);
    resultFrac = subFrac(w2 * d2 + n2, d2, w1 * d1 + n1, d1);
  }
  const resultDisplay = exactMixedDisplay(resultFrac[0], resultFrac[1]);

  return {
    type: 'addsub', tier,
    context: missing
      ? `A scout needs to find how much more is needed to hit the next milestone for ${flavor.thing}.`
      : op === 'add'
        ? `Two attempts at ${flavor.thing} were combined for a team record.`
        : `Find the exact gap between two attempts at ${flavor.thing}.`,
    left: { w: w1, n: n1, d: d1 }, right: { w: w2, n: n2, d: d2 }, op, correctValue, flavor,
    recordValue: missing
      ? `${formatMixedText(w1, n1, d1)} + ${resultDisplay} = ${formatMixedText(w2, n2, d2)} ${flavor.unit}`
      : `${formatMixedText(w1, n1, d1)} ${op === 'add' ? '+' : '−'} ${formatMixedText(w2, n2, d2)} = ${resultDisplay} ${flavor.unit}`,
  };
}

// ---------- MULTIPLY ----------
function genMultiply(tier) {
  const flavor = pickRecord();
  let w, n, d, whole;
  if (tier === 1) { d = pick([3, 4, 5, 6]); n = randInt(1, d - 1); whole = randInt(2, 6); w = 0; }
  else if (tier === 2) { d = pick([4, 5, 6, 8]); n = randInt(1, d - 1); whole = randInt(4, 11); w = 0; }
  else if (tier === 3) { d = pick([3, 4, 5]); n = randInt(1, d - 1); w = randInt(1, 5); whole = randInt(2, 4); }
  else if (tier === 4) { d = pick([4, 6, 8, 10]); n = randInt(1, d - 1); w = randInt(2, 8); whole = randInt(2, 5); }
  else if (tier === 5) { d = pick([5, 8, 10, 12]); n = randInt(1, d - 1); w = randInt(3, 12); whole = randInt(3, 6); }
  else { d = pick([6, 8, 9, 10]); n = randInt(1, d - 1); w = randInt(4, 15); whole = randInt(2, 4); }
  const baseVal = w + n / d;
  const correctValue = baseVal * whole;
  const resultFrac = mulFracWhole(w * d + n, d, whole);
  const resultDisplay = exactMixedDisplay(resultFrac[0], resultFrac[1]);
  return {
    type: 'multiply', tier,
    context: `A record gets verified, then scaled up by a factor of ${whole} for the "Supersized" category.`,
    left: { w, n, d }, whole, correctValue, flavor,
    recordValue: `${formatMixedText(w, n, d)} × ${whole} = ${resultDisplay} ${flavor.unit}`,
  };
}

// ---------- LINE PLOT ----------
function genLinePlot(tier) {
  const flavor = pickRecord();
  const names = ['Ari', 'Jules', 'Sam', 'Nia', 'Theo', 'Priya', 'Diego', 'Mo'];
  const shuffledNames = [...names].sort(() => Math.random() - 0.5);
  const count = tier <= 2 ? 5 : 7;
  const denom = pick([4, 8]);
  const baseWhole = randInt(1, 4);
  const data = [];
  const usedVals = new Set();
  for (let i = 0; i < count; i++) {
    let w, n, key;
    do {
      w = baseWhole + randInt(0, 2);
      n = randInt(0, denom - 1);
      key = w + '/' + n;
    } while (usedVals.has(key));
    usedVals.add(key);
    data.push({ name: shuffledNames[i], w, n, d: denom, value: w + n / denom });
  }
  data.sort((a, b) => a.value - b.value);
  const shortest = data[0], longest = data[data.length - 1];
  const questionKinds = ['difference', 'compare-two', 'who-more'];
  const kind = pick(questionKinds);
  if (kind === 'compare-two') {
    const [p1, p2] = pick2Distinct(data);
    const correctRel = p1.value < p2.value ? 'less' : p1.value > p2.value ? 'greater' : 'equal';
    const relWord = correctRel === 'less' ? 'is shorter than' : correctRel === 'greater' ? 'is longer than' : 'equals';
    return {
      type: 'lineplot-compare', tier, data, flavor,
      context: `A line plot shows several attempts at ${flavor.thing}.`,
      question: `Compare ${p1.name} and ${p2.name}'s attempts using >, <, or =.`,
      left: p1, right: p2,
      correct: correctRel,
      recordValue: `${p1.name}'s ${formatMixedText(p1.w, p1.n, p1.d)} ${flavor.unit} ${relWord} ${p2.name}'s ${formatMixedText(p2.w, p2.n, p2.d)} ${flavor.unit}`,
    };
  } else if (kind === 'who-more' && data.length >= 3) {
    const mid = data[randInt(1, data.length - 2)];
    const diffFrac = subFrac(longest.w * longest.d + longest.n, longest.d, mid.w * mid.d + mid.n, mid.d);
    return {
      type: 'lineplot-value', tier, data, flavor,
      context: `A line plot shows several attempts at ${flavor.thing}.`,
      question: `How much farther did ${longest.name} go than ${mid.name}, in ${flavor.unit}?`,
      correctValue: longest.value - mid.value,
      extra: { a: longest, b: mid },
      recordValue: `${longest.name} (${formatMixedText(longest.w, longest.n, longest.d)}) − ${mid.name} (${formatMixedText(mid.w, mid.n, mid.d)}) = ${exactMixedDisplay(diffFrac[0], diffFrac[1])} ${flavor.unit}`,
    };
  } else {
    const diffFrac = subFrac(longest.w * longest.d + longest.n, longest.d, shortest.w * shortest.d + shortest.n, shortest.d);
    return {
      type: 'lineplot-value', tier, data, flavor,
      context: `A line plot shows several attempts at ${flavor.thing}.`,
      question: `What is the difference, in ${flavor.unit}, between the longest and shortest attempt?`,
      correctValue: longest.value - shortest.value,
      extra: { a: longest, b: shortest },
      recordValue: `${longest.name} (${formatMixedText(longest.w, longest.n, longest.d)}) − ${shortest.name} (${formatMixedText(shortest.w, shortest.n, shortest.d)}) = ${exactMixedDisplay(diffFrac[0], diffFrac[1])} ${flavor.unit}`,
    };
  }
}
function pick2Distinct(arr) {
  const i = randInt(0, arr.length - 1);
  let j = randInt(0, arr.length - 1);
  while (j === i) j = randInt(0, arr.length - 1);
  return [arr[i], arr[j]];
}

const GENERATORS = {
  compare: genCompare,
  convert: genConvert,
  estimate: genEstimate,
  addsub: genAddSub,
  multiply: genMultiply,
  lineplot: genLinePlot,
};

<script>
// ============================================================
// VISUAL AID SCRATCHPAD — an interactive tool the learner
// operates themselves. Nothing is pre-plotted or pre-solved:
// the learner taps to place points and uses steppers to build
// groupings. Purely optional; never required to answer.
// ============================================================

let vaState = null;

function vaFracLabel(w, n, d) {
  if (n === 0) return `${w}`;
  if (w === 0) return `${n}/${d}`;
  return `${w} ${n}/${d}`;
}
function vaZoneLabel(lo, wholeIdx, rem, splitParts) {
  const whole = lo + wholeIdx;
  if (rem === 0) return `${whole}`;
  if (whole === 0) return `${rem}/${splitParts}`;
  return `${whole} ${rem}/${splitParts}`;
}

// ---------- reset per-question state ----------
function vaInit(q) {
  vaState = {
    dots: [null, null],
    armed: 0,
    splitParts: 1,
    groupSize: 1,
    copies: 1,
  };
}

// ---------- bounds helper: derived only from values already visible in the question ----------
function vaLineBounds(q) {
  if (q.type === 'compare' || q.type === 'estimate') {
    const a = mixedValue(q.left.w, q.left.n, q.left.d);
    const b = mixedValue(q.right.w, q.right.n, q.right.d);
    return [Math.floor(Math.min(a, b)), Math.ceil(Math.max(a, b))];
  }
  if (q.type === 'lineplot-compare') {
    return [Math.floor(Math.min(q.left.value, q.right.value)), Math.ceil(Math.max(q.left.value, q.right.value))];
  }
  if (q.type === 'lineplot-value') {
    const a = q.extra.a.value, b = q.extra.b.value;
    return [Math.floor(Math.min(a, b)), Math.ceil(Math.max(a, b)) + 1];
  }
  if (q.type === 'addsub') {
    const a = mixedValue(q.left.w, q.left.n, q.left.d);
    const b = mixedValue(q.right.w, q.right.n, q.right.d);
    if (q.op === 'missing-add') {
      return [Math.floor(Math.min(a, b)), Math.ceil(Math.max(a, b)) + 1];
    }
    // give generous room to explore the move without landing exactly on a labeled answer
    const reach = a + b + 1;
    return [Math.max(0, Math.floor(a - b - 1)), Math.ceil(reach)];
  }
  return [0, 5];
}

// ---------- number line tool (compare, estimate, addsub, lineplot-*) ----------
function vaNumberLineHTML(q) {
  const [lo, hi] = vaLineBounds(q);
  const span = Math.max(1, hi - lo);
  const splitParts = vaState.splitParts;
  const totalSteps = span * splitParts;

  let wholeTicks = '';
  for (let i = 0; i <= span; i++) {
    const pct = (i / span) * 100;
    wholeTicks += `<div class="va-tick" style="left:${pct}%"></div><div class="va-ticklabel" style="left:${pct}%">${lo + i}</div>`;
  }
  let zones = '';
  for (let i = 0; i <= totalSteps; i++) {
    if (i % splitParts === 0) continue; // whole-number ticks already drawn above
    const pct = (i / totalSteps) * 100;
    zones += `<div class="va-zone" data-idx="${i}" style="left:${pct}%"></div>`;
  }
  // whole-number positions are also valid tap targets
  for (let i = 0; i <= span; i++) {
    const pct = (i / span) * 100;
    zones += `<div class="va-zone va-zone-whole" data-idx="${i * splitParts}" style="left:${pct}%"></div>`;
  }
  let dotsHtml = '';
  vaState.dots.forEach((d, idx) => {
    if (d == null) return;
    const pct = ((d.value - lo) / span) * 100;
    const cls = idx === 0 ? 'va-dot-a' : 'va-dot-b';
    dotsHtml += `<div class="va-dot-label ${cls}" style="left:${pct}%">${d.label}</div>`;
    dotsHtml += `<div class="va-dot ${cls}" style="left:${pct}%"></div>`;
  });

  const armLabels = vaArmLabels(q);

  return `
    <div class="va-instruction">${vaInstruction(q)}</div>
    <div class="va-armrow">
      <button type="button" class="va-arm-btn va-arm-a ${vaState.armed === 0 ? 'active' : ''}" data-arm="0">${armLabels[0]}</button>
      <button type="button" class="va-arm-btn va-arm-b ${vaState.armed === 1 ? 'active' : ''}" data-arm="1" ${vaState.dots[0] == null ? 'disabled' : ''}>${armLabels[1]}</button>
    </div>
    ${vaState.dots[0] == null ? `<div class="va-lockhint">Place the first number to unlock the second</div>` : ''}
    <div class="va-line-wrap"><div class="va-line-inner">
      <div class="va-line">${wholeTicks}${zones}${dotsHtml}</div>
    </div></div>
    <div class="va-splitrow">
      <span class="va-splitlabel">Split each whole into</span>
      <button type="button" class="va-split-minus pm">−</button>
      <span class="va-splitval">${splitParts}</span>
      <button type="button" class="va-split-plus pm">+</button>
      <span class="va-splitlabel">equal parts</span>
    </div>`;
}
function vaArmLabels(q) {
  if (q.type === 'compare') return ['📍 First number', '📍 Second number'];
  if (q.type === 'estimate') return ['📍 First number', '📍 Second number'];
  if (q.type === 'lineplot-compare') return [`📍 ${q.left.name}`, `📍 ${q.right.name}`];
  if (q.type === 'lineplot-value') return [`📍 ${q.extra.a.name}`, `📍 ${q.extra.b.name}`];
  if (q.type === 'addsub') return ['📍 Starting number', '📍 Where you land'];
  return ['📍 Point 1', '📍 Point 2'];
}
function vaInstruction(q) {
  if (q.type === 'compare') return 'Tap the line to plot each number, then see which is farther right.';
  if (q.type === 'estimate') return 'Tap the line to plot each number and see which whole it is closest to.';
  if (q.type === 'lineplot-compare') return `Tap the line to plot ${q.left.name} and ${q.right.name}.`;
  if (q.type === 'lineplot-value') return `Tap the line to plot both attempts, then look at the gap between them.`;
  if (q.type === 'addsub') {
    if (q.op === 'missing-add') return 'Tap the line to plot both known numbers, then look at the gap between them.';
    const opWord = q.op === 'add' ? 'adding' : 'subtracting';
    return `Plot your starting number, then tap where you land after ${opWord}.`;
  }
  return 'Tap the line to plot points.';
}

// ---------- groupable bar tool (convert) ----------
function vaConvertNumerator(q) {
  return q.type === 'convert-to-mixed' ? q.given.n : (q.given.w * q.given.d + q.given.n);
}
function vaGroupedBarHTML(q) {
  const numerator = vaConvertNumerator(q);
  const denominator = q.given.d;
  const groupSize = vaState.groupSize;
  const colors = ['#6B8F71', '#2ec4b6', '#f4b942', '#ff6f61', '#a78bfa', '#4fb0d9'];
  let cellsHtml = '';
  for (let i = 0; i < numerator; i++) {
    const groupIdx = Math.floor(i / groupSize);
    const isNewGroup = i % groupSize === 0 && i !== 0;
    cellsHtml += `<div class="va-cell${isNewGroup ? ' va-cell-newgroup' : ''}" style="background:${colors[groupIdx % colors.length]}"></div>`;
  }
  return `
    <div class="va-instruction">Use the stepper to group these ${numerator} pieces and see how many equal groups you can make.</div>
    <div class="va-cellrow">${cellsHtml}</div>
    <div class="va-splitrow">
      <span class="va-splitlabel">Group into sets of</span>
      <button type="button" class="va-group-minus pm">−</button>
      <span class="va-groupval">${groupSize}</span>
      <button type="button" class="va-group-plus pm">+</button>
    </div>`;
}

// ---------- repeatable bar tool (multiply) ----------
function vaRepeatedBarHTML(q) {
  const unitLabel = vaFracLabel(q.left.w, q.left.n, q.left.d);
  const colors = ['#6B8F71', '#2ec4b6', '#f4b942', '#ff6f61', '#a78bfa', '#4fb0d9'];
  let segsHtml = '';
  for (let i = 0; i < vaState.copies; i++) {
    segsHtml += `<div class="va-repseg" style="background:${colors[i % colors.length]}">${unitLabel}</div>`;
  }
  return `
    <div class="va-instruction">Build ${q.whole} copies of ${unitLabel} to see the repeated addition.</div>
    <div class="va-repeat-wrap">${segsHtml}</div>
    <div class="va-splitrow">
      <span class="va-splitlabel">Copies</span>
      <button type="button" class="va-copy-minus pm">−</button>
      <span class="va-copyval">${vaState.copies}</span>
      <button type="button" class="va-copy-plus pm">+</button>
    </div>`;
}

// ---------- dispatcher ----------
function vaBuildHTML(q) {
  if (['compare', 'estimate', 'addsub', 'lineplot-compare', 'lineplot-value'].includes(q.type)) {
    return vaNumberLineHTML(q);
  }
  if (q.type === 'convert-to-mixed' || q.type === 'convert-to-improper') {
    return vaGroupedBarHTML(q);
  }
  if (q.type === 'multiply') {
    return vaRepeatedBarHTML(q);
  }
  return '';
}

// ---------- render + wire (full re-render on every interaction; panel is small) ----------
function vaRenderPanel(q) {
  const panel = document.getElementById('va-panel');
  if (!panel) return;
  panel.innerHTML = vaBuildHTML(q);
  vaWire(q);
}

function vaWire(q) {
  const panel = document.getElementById('va-panel');
  if (!panel) return;

  panel.querySelectorAll('.va-arm-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      vaState.armed = parseInt(btn.dataset.arm, 10);
      vaRenderPanel(q);
    });
  });

  panel.querySelectorAll('.va-zone').forEach(zone => {
    zone.addEventListener('click', () => {
      const [lo] = vaLineBounds(q);
      const idx = parseInt(zone.dataset.idx, 10);
      const splitParts = vaState.splitParts;
      const wholeIdx = Math.floor(idx / splitParts);
      const rem = idx % splitParts;
      const value = lo + idx / splitParts;
      const label = vaZoneLabel(lo, wholeIdx, rem, splitParts);
      vaState.dots[vaState.armed] = { value, label };
      // auto-advance to the other point for convenience
      vaState.armed = vaState.armed === 0 ? 1 : 0;
      vaRenderPanel(q);
    });
  });

  const splitMinus = panel.querySelector('.va-split-minus');
  const splitPlus = panel.querySelector('.va-split-plus');
  if (splitMinus) splitMinus.addEventListener('click', () => {
    vaState.splitParts = Math.max(1, vaState.splitParts - 1);
    vaRenderPanel(q);
  });
  if (splitPlus) splitPlus.addEventListener('click', () => {
    vaState.splitParts = Math.min(12, vaState.splitParts + 1);
    vaRenderPanel(q);
  });

  const groupMinus = panel.querySelector('.va-group-minus');
  const groupPlus = panel.querySelector('.va-group-plus');
  if (groupMinus) groupMinus.addEventListener('click', () => {
    vaState.groupSize = Math.max(1, vaState.groupSize - 1);
    vaRenderPanel(q);
  });
  if (groupPlus) groupPlus.addEventListener('click', () => {
    const maxGroup = vaConvertNumerator(q);
    vaState.groupSize = Math.min(maxGroup, vaState.groupSize + 1);
    vaRenderPanel(q);
  });

  const copyMinus = panel.querySelector('.va-copy-minus');
  const copyPlus = panel.querySelector('.va-copy-plus');
  if (copyMinus) copyMinus.addEventListener('click', () => {
    vaState.copies = Math.max(1, vaState.copies - 1);
    vaRenderPanel(q);
  });
  if (copyPlus) copyPlus.addEventListener('click', () => {
    vaState.copies = Math.min(10, vaState.copies + 1);
    vaRenderPanel(q);
  });
}

</script>
<script>
// ============================================================
// GAME STATE
// ============================================================
const SAVE_KEY = 'recordBreakers_save_v1';

function defaultState() {
  const progress = {};
  CATEGORIES.forEach(c => { progress[c.id] = { currentTier: 1, completed: false }; });
  return {
    progress,
    book: [], // array of { catId, tier, name, emoji, fact, value }
    seenTutorial: false,
  };
}

let state = defaultState();
let currentBooth = null; // category id currently being played
let currentQuestion = null;
let hasAnswered = false;
let selectedCompare = null; // 'less' | 'greater' | 'equal'

// ---------- mascot ----------
function setMascot(elId, pose) {
  const el = document.getElementById(elId);
  if (el && MASCOT_SVGS[pose]) el.innerHTML = MASCOT_SVGS[pose];
}
function setMascotEverywhere(pose) {
  ['mascot-title', 'mascot-hub', 'mascot-play'].forEach(id => setMascot(id, pose));
}

// ---------- rank titles ----------
const TOTAL_QUESTIONS = CATEGORIES.reduce((sum, c) => sum + c.tiers, 0);
const RANK_TITLES = [
  { min: 0, title: 'Rookie Scout' },
  { min: 9, title: 'Junior Scout' },
  { min: 18, title: 'Senior Scout' },
  { min: 27, title: 'Expert Scout' },
  { min: TOTAL_QUESTIONS, title: 'Master Record Scout' },
];
function getRankTitle(certifiedCount) {
  let current = RANK_TITLES[0].title;
  for (const r of RANK_TITLES) {
    if (certifiedCount >= r.min) current = r.title;
  }
  return current;
}

// ---------- persistence ----------
async function saveGame() {
  const payload = JSON.stringify(state);
  try {
    if (window.storage && window.storage.set) {
      await window.storage.set(SAVE_KEY, payload, false);
    } else {
      localStorage.setItem(SAVE_KEY, payload);
    }
  } catch (e) {
    try { localStorage.setItem(SAVE_KEY, payload); } catch (e2) { /* ignore */ }
  }
}
async function loadGame() {
  try {
    if (window.storage && window.storage.get) {
      const res = await window.storage.get(SAVE_KEY, false);
      if (res && res.value) return JSON.parse(res.value);
      return null;
    } else {
      const raw = localStorage.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    }
  } catch (e) {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e2) { return null; }
  }
}

// ============================================================
// SCREEN MANAGEMENT
// ============================================================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ============================================================
// TUTORIAL
// ============================================================
const TUTORIAL_SLIDES = [
  { emoji: '🎪', title: 'Welcome, Record Scout!', body: "The World Record Expo is opening, and it needs a scout to verify every wild record before it goes in the official Record Book. That's you!" },
  { emoji: '📏', title: 'Visit the Booths', body: "Each booth at the Expo tests a different measuring skill — comparing, converting, estimating, adding, subtracting, and multiplying fractions." },
  { emoji: '✅', title: 'Certify Real Records', body: "Answer correctly to certify a real world record into your Record Book — with the actual Guinness World Record fact! Get it wrong and you'll just try a fresh measurement — no penalty." },
  { emoji: '🏆', title: 'Fill Your Record Book', body: "Complete every booth to become a Master Record Scout and fill your book with real, wild world records. Let's get measuring!" },
];
let tutIndex = 0;
function renderTutorial() {
  const slide = TUTORIAL_SLIDES[tutIndex];
  document.getElementById('tut-card-content').innerHTML = `
    <div class="tut-emoji">${slide.emoji}</div>
    <div class="tut-title">${slide.title}</div>
    <div class="tut-body">${slide.body}</div>
  `;
  const dots = document.getElementById('tut-dots');
  dots.innerHTML = TUTORIAL_SLIDES.map((_, i) => `<div class="tut-dot ${i === tutIndex ? 'active' : ''}"></div>`).join('');
  document.getElementById('tut-next').textContent = tutIndex === TUTORIAL_SLIDES.length - 1 ? "Let's Go!" : 'Next';
}

// ============================================================
// HUB
// ============================================================
function renderHub() {
  setMascot('mascot-hub', 'idle');
  document.getElementById('hub-rank').textContent = getRankTitle(state.book.length);
  const grid = document.getElementById('booth-grid');
  grid.innerHTML = '';
  CATEGORIES.forEach((cat, idx) => {
    const prog = state.progress[cat.id];
    const locked = false; // all booths open from the start; play in any order
    const starsFilled = prog.completed ? cat.tiers : (prog.currentTier - 1);
    let starsHtml = '';
    for (let i = 0; i < cat.tiers; i++) {
      starsHtml += `<span class="stamp ${i < starsFilled ? 'filled' : ''}">${i < starsFilled ? '&#10003;' : ''}</span>`;
    }
    const card = document.createElement('div');
    card.className = `booth-card ${locked ? 'locked' : ''} ${prog.completed ? 'done' : ''}`;
    card.innerHTML = `
      <div class="booth-icon">${cat.icon}</div>
      <div class="booth-info">
        <div class="booth-name">${cat.name}</div>
        <div class="booth-desc">${cat.desc}</div>
        <div class="booth-progress">${starsHtml}</div>
      </div>
      ${locked ? '<div class="booth-lock-icon">🔒</div>' : (prog.completed ? '<div class="booth-check">✓</div>' : '')}
    `;
    if (!locked) {
      card.addEventListener('click', () => openBoothIntro(cat.id));
    }
    grid.appendChild(card);
  });
  checkAllComplete();
}
function checkAllComplete() {
  const allDone = CATEGORIES.every(c => state.progress[c.id].completed);
  if (allDone) {
    document.getElementById('finale-count').textContent = state.book.length;
  }
  return allDone;
}

function openBoothIntro(catId) {
  currentBooth = catId;
  const cat = CATEGORIES.find(c => c.id === catId);
  document.getElementById('booth-intro-card').innerHTML = `
    <div class="booth-intro-emoji">${cat.icon}</div>
    <div class="booth-intro-title">${cat.name}</div>
    <div class="booth-intro-desc">${cat.introText}</div>
  `;
  showScreen('screen-booth-intro');
}

// ============================================================
// PLAY / QUESTION FLOW
// ============================================================
function startBooth(catId) {
  currentBooth = catId;
  loadNextQuestion();
  showScreen('screen-play');
}

function loadNextQuestion() {
  const cat = CATEGORIES.find(c => c.id === currentBooth);
  const prog = state.progress[currentBooth];
  const tier = prog.currentTier;
  currentQuestion = GENERATORS[currentBooth](tier);
  hasAnswered = false;
  selectedCompare = null;
  vaInit(currentQuestion);
  renderPlayScreen();
}

function renderPlayScreen() {
  setMascot('mascot-play', 'idle');
  const cat = CATEGORIES.find(c => c.id === currentBooth);
  const prog = state.progress[currentBooth];
  const pct = Math.round(((prog.currentTier - 1) / cat.tiers) * 100);
  document.getElementById('play-progressfill').style.width = pct + '%';
  document.getElementById('play-context-badge').innerHTML = `${cat.icon} ${cat.name} — Question ${prog.currentTier} of ${cat.tiers}`;

  const card = document.getElementById('question-card');
  card.innerHTML = renderQuestionContent(currentQuestion);

  document.getElementById('feedback-banner').className = 'feedback-banner';
  document.getElementById('feedback-banner').textContent = '';
  document.getElementById('btn-submit-answer').style.display = 'inline-block';
  document.getElementById('btn-submit-answer').disabled = false;
  document.getElementById('btn-next-question').style.display = 'none';

  attachAnswerHandlers(currentQuestion);
}

function fracHtml(f) {
  let out = '';
  if (f.w && f.w !== 0) out += `<span class="q-mixed-whole">${f.w}</span>`;
  if (f.n !== 0) {
    out += `<span class="q-fraction-display"><span class="num">${f.n}</span><span class="den">${f.d}</span></span>`;
  } else if (!f.w) {
    out += `<span class="q-mixed-whole">0</span>`;
  }
  return out;
}

function renderQuestionContent(q) {
  let html = `<div class="q-context">${q.context}</div>`;
  if (q.type === 'compare') {
    html += `<div class="q-prompt">Which measurement is larger?</div>`;
    html += `<div class="q-visual"><div class="q-compare-row">${fracHtml(q.left)} ${symbolCircleHtml()} ${fracHtml(q.right)}</div></div>`;
  } else if (q.type === 'convert-to-mixed') {
    html += `<div class="q-prompt">Convert this improper fraction into a mixed number.</div>`;
    html += `<div class="q-visual">${fracHtml({ w: 0, n: q.given.n, d: q.given.d })}</div>`;
    html += mixedInputHtml();
  } else if (q.type === 'convert-to-improper') {
    html += `<div class="q-prompt">Convert this mixed number into an improper fraction.</div>`;
    html += `<div class="q-visual">${fracHtml(q.given)}</div>`;
    html += fractionOnlyInputHtml();
  } else if (q.type === 'estimate') {
    html += `<div class="q-prompt">Round each number, then estimate the ${q.op === 'add' ? 'sum' : 'difference'}.</div>`;
    html += `<div class="q-visual"><div class="q-compare-row">${fracHtml(q.left)} <span class="q-op">${q.op === 'add' ? '+' : '−'}</span> ${fracHtml(q.right)}</div></div>`;
    html += singleInputHtml('Estimate');
  } else if (q.type === 'addsub') {
    if (q.op === 'missing-add') {
      html += `<div class="q-prompt">What number is missing?</div>`;
      html += `<div class="q-visual"><div class="q-compare-row">${fracHtml(q.left)} <span class="q-op">+</span> <span style="font-weight:800;font-size:26px;">?</span> <span class="q-op">=</span> ${fracHtml(q.right)}</div></div>`;
    } else {
      html += `<div class="q-prompt">Solve exactly.</div>`;
      html += `<div class="q-visual"><div class="q-compare-row">${fracHtml(q.left)} <span class="q-op">${q.op === 'add' ? '+' : '−'}</span> ${fracHtml(q.right)}</div></div>`;
    }
    html += mixedInputHtml();
  } else if (q.type === 'multiply') {
    html += `<div class="q-prompt">Solve exactly.</div>`;
    html += `<div class="q-visual"><div class="q-compare-row">${fracHtml(q.left)} <span class="q-op">×</span> <span class="q-mixed-whole">${q.whole}</span></div></div>`;
    html += mixedInputHtml();
  } else if (q.type === 'lineplot-value') {
    html += `<div class="q-prompt">${q.question}</div>`;
    html += lineplotHtml(q);
    html += mixedInputHtml();
  } else if (q.type === 'lineplot-compare') {
    html += `<div class="q-prompt">${q.question}</div>`;
    html += lineplotHtml(q);
    html += symbolCircleHtml();
  }
  html += `<div class="va-toggle-row">
    <button type="button" class="va-toggle-btn" id="va-toggle-btn">🔍 Use a tool</button>
  </div>
  <div class="va-panel" id="va-panel" style="display:none;"></div>`;
  return html;
}

const SYMBOL_LABELS = { less: '<', equal: '=', greater: '>' };
function symbolCircleHtml() {
  return `<div class="symbol-circle-wrap"><button type="button" class="symbol-circle" id="symbol-circle-btn">?</button></div>`;
}
function mixedInputHtml() {
  return `<div class="answer-area mixed-input-row">
    <div class="mn-whole-wrap">
      <input type="number" class="num-input" id="in-whole" placeholder="0" inputmode="numeric">
      <div class="mn-label">Whole</div>
    </div>
    <div class="mn-frac-wrap">
      <input type="number" class="num-input" id="in-num" placeholder="n" inputmode="numeric">
      <div class="mn-divider"></div>
      <input type="number" class="num-input" id="in-den" placeholder="d" inputmode="numeric">
      <div class="mn-label">Fraction</div>
    </div>
  </div>`;
}
function fractionOnlyInputHtml() {
  return `<div class="answer-area mixed-input-row">
    <div class="mn-frac-wrap">
      <input type="number" class="num-input" id="in-num" placeholder="n" inputmode="numeric">
      <div class="mn-divider"></div>
      <input type="number" class="num-input" id="in-den" placeholder="d" inputmode="numeric">
      <div class="mn-label">Fraction</div>
    </div>
  </div>`;
}
function singleInputHtml(label) {
  return `<div class="answer-area single-input-row">
    <input type="number" class="single-input" id="in-single" placeholder="?" inputmode="numeric">
  </div>`;
}

function lineplotHtml(q) {
  const data = q.data;
  const d = data[0].d;
  const minW = Math.min(...data.map(p => p.w));
  const maxW = Math.max(...data.map(p => p.w)) + 1;
  const totalTicks = (maxW - minW) * d;
  const trackWidth = Math.max(280, totalTicks * 26);
  let ticksHtml = '';
  for (let i = 0; i <= totalTicks; i++) {
    const leftPct = (i / totalTicks) * 100;
    if (i % d === 0) {
      ticksHtml += `<div class="lineplot-tick" style="left:${leftPct}%">${minW + i / d}</div>`;
      ticksHtml += `<div class="lineplot-tickmark" style="left:${leftPct}%"></div>`;
    }
  }
  // stack dots (as X marks) that land on same position, no per-dot names to avoid clutter
  const posCount = {};
  let dotsHtml = '';
  const sortedForPlot = [...data].sort((a, b) => a.value - b.value);
  sortedForPlot.forEach(p => {
    const posIdx = (p.w - minW) * d + p.n;
    const leftPct = (posIdx / totalTicks) * 100;
    posCount[posIdx] = (posCount[posIdx] || 0);
    const stackOffset = posCount[posIdx] * 15;
    posCount[posIdx]++;
    dotsHtml += `<div class="lineplot-dot" style="left:${leftPct}%;bottom:${20 + stackOffset}px;">✕</div>`;
  });
  const legendHtml = `<div class="lineplot-legend">${data.map(p =>
    `<div class="lineplot-legend-item"><span class="ll-name">${p.name}</span><span class="ll-val">${formatMixedText(p.w, p.n, p.d)}</span></div>`
  ).join('')}</div>`;
  return `<div class="lineplot-wrap"><div class="lineplot-track" style="min-width:${trackWidth}px;">
    <div class="lineplot-axis"></div>
    ${ticksHtml}
    ${dotsHtml}
  </div></div>${legendHtml}`;
}

// ---------- answer handlers ----------
function attachAnswerHandlers(q) {
  const vaBtn = document.getElementById('va-toggle-btn');
  if (vaBtn) {
    let vaBuilt = false;
    vaBtn.addEventListener('click', () => {
      const panel = document.getElementById('va-panel');
      const isHidden = panel.style.display === 'none';
      if (isHidden && !vaBuilt) {
        vaRenderPanel(q);
        vaBuilt = true;
      }
      panel.style.display = isHidden ? 'block' : 'none';
      vaBtn.textContent = isHidden ? '✕ Hide tool' : '🔍 Use a tool';
    });
  }
  if (q.type === 'compare' || q.type === 'lineplot-compare') {
    const circle = document.getElementById('symbol-circle-btn');
    if (circle) {
      circle.addEventListener('click', () => {
        document.getElementById('symbol-picker-overlay').classList.add('active');
      });
    }
  }
}

function wireSymbolPicker() {
  const overlay = document.getElementById('symbol-picker-overlay');
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('active');
  });
  document.querySelectorAll('.symbol-picker-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedCompare = btn.dataset.choice;
      const circle = document.getElementById('symbol-circle-btn');
      if (circle) {
        circle.textContent = SYMBOL_LABELS[selectedCompare];
        circle.classList.add('chosen');
      }
      overlay.classList.remove('active');
    });
  });
}

function getUserAnswerValue(q) {
  if (q.type === 'compare' || q.type === 'lineplot-compare') {
    return selectedCompare;
  }
  if (q.type === 'convert-to-improper') {
    const n = parseFloat(document.getElementById('in-num').value);
    const d = parseFloat(document.getElementById('in-den').value);
    if (isNaN(n) || isNaN(d) || d === 0) return null;
    return n / d;
  }
  if (q.type === 'estimate') {
    const v = parseFloat(document.getElementById('in-single').value);
    if (isNaN(v)) return null;
    return v;
  }
  // mixed input types
  const wRaw = document.getElementById('in-whole') ? document.getElementById('in-whole').value : '';
  const nRaw = document.getElementById('in-num').value;
  const dRaw = document.getElementById('in-den').value;
  const w = wRaw === '' ? 0 : parseFloat(wRaw);
  if (nRaw === '' && dRaw === '') {
    // whole-number-only answer is valid (e.g. "2" with the fraction left blank)
    if (wRaw === '') return null;
    return w;
  }
  const n = parseFloat(nRaw);
  const d = parseFloat(dRaw);
  if (isNaN(n) || isNaN(d) || d === 0) return null;
  return w + n / d;
}

function checkAnswer() {
  const q = currentQuestion;
  const userVal = getUserAnswerValue(q);
  if (userVal === null || userVal === undefined) {
    flashFeedback('incorrect', "Please fill in an answer first!");
    return;
  }
  setMascot('mascot-play', 'checking');
  let correct = false;
  if (q.type === 'compare' || q.type === 'lineplot-compare') {
    correct = userVal === q.correct;
  } else if (q.type === 'estimate') {
    correct = Math.abs(userVal - q.correctValue) <= (q.tolerance || 1) + 1e-9;
  } else {
    correct = Math.abs(userVal - q.correctValue) < 1e-6;
  }
  hasAnswered = true;
  document.getElementById('btn-submit-answer').style.display = 'none';
  document.getElementById('btn-next-question').style.display = 'inline-block';

  if (correct) {
    setMascot('mascot-play', 'celebrate');
    flashFeedback('correct', pick(['Certified! 🎉', 'Correct! Record verified!', "That's official!", 'Nailed it!']));
    certifyRecord(q);
  } else {
    setMascot('mascot-play', 'idle');
    flashFeedback('incorrect', "Not quite — that record can't be certified yet. Let's try a fresh measurement!");
    document.getElementById('btn-next-question').textContent = 'Try Again →';
  }
}
function flashFeedback(kind, msg) {
  const el = document.getElementById('feedback-banner');
  el.className = `feedback-banner ${kind}`;
  el.textContent = msg;
}

function nextQuestionOrAdvance() {
  const wasCorrect = document.getElementById('feedback-banner').classList.contains('correct');
  document.getElementById('btn-next-question').textContent = 'Next →';
  if (wasCorrect) {
    const cat = CATEGORIES.find(c => c.id === currentBooth);
    const prog = state.progress[currentBooth];
    prog.currentTier += 1;
    if (prog.currentTier > cat.tiers) {
      prog.completed = true;
      saveGame();
      showBoothComplete(cat);
      return;
    }
    saveGame();
    loadNextQuestion();
  } else {
    // retry same tier with fresh numbers
    loadNextQuestion();
  }
}

// ============================================================
// RECORD CERTIFICATION
// ============================================================
function certifyRecord(q) {
  const flavor = q.flavor || pickRecord();
  const entry = { catId: currentBooth, name: flavor.name, emoji: flavor.emoji, fact: flavor.fact, value: q.recordValue || '', country: flavor.country, pin: flavor.pin };
  state.book.push(entry);
  saveGame();
  showCertOverlay(entry);
}
function showCertOverlay(entry) {
  document.getElementById('cert-card').innerHTML = `
    <div class="mascot-wrap mascot-cert">${MASCOT_SVGS.celebrate}</div>
    <div class="cert-emoji">${entry.emoji}</div>
    <div class="cert-heading">Record Certified</div>
    <div class="cert-name">${entry.name}</div>
    <div class="cert-fact">🌍 ${entry.fact}</div>
    <div class="cert-divider"></div>
    <div class="cert-practice-label">What you solved</div>
    <div class="cert-value">${entry.value}</div>
    <button class="btn" id="btn-cert-next" style="margin-top:18px;width:100%;">Next Record →</button>
  `;
  const overlay = document.getElementById('cert-overlay');
  overlay.classList.add('active');
  spawnConfetti();
  document.getElementById('btn-cert-next').addEventListener('click', () => {
    overlay.classList.remove('active');
    nextQuestionOrAdvance();
  });
}
function spawnConfetti() {
  const colors = ['#f4b942', '#ff6f61', '#2ec4b6', '#3ecf6a', '#fffaf0'];
  const app = document.getElementById('app');
  for (let i = 0; i < 24; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[i % colors.length];
    piece.style.animationDuration = (1 + Math.random() * 1.2) + 's';
    piece.style.zIndex = 60;
    app.appendChild(piece);
    setTimeout(() => piece.remove(), 2400);
  }
}

function showBoothComplete(cat) {
  document.getElementById('complete-card').innerHTML = `
    <div class="mascot-wrap mascot-complete">${MASCOT_SVGS.celebrate}</div>
    <div class="complete-title">${cat.name} Complete!</div>
    <div class="complete-sub">Every record at this booth is officially certified.</div>
    <div class="complete-stars">${'<span class="stamp filled complete-stamp">&#10003;</span>'.repeat(cat.tiers)}</div>
    <div class="title-buttons" style="margin-top:20px;">
      <button class="btn" id="btn-complete-continue">Back to Expo</button>
    </div>
  `;
  document.getElementById('complete-overlay').classList.add('active');
  spawnConfetti();
  document.getElementById('btn-complete-continue').addEventListener('click', () => {
    document.getElementById('complete-overlay').classList.remove('active');
    goToHub();
  });
}

// ============================================================
// RECORD BOOK
// ============================================================
function renderBook() {
  const content = document.getElementById('book-content');
  if (state.book.length === 0) {
    content.innerHTML = `<div class="book-empty">Your Record Book is empty so far.<br>Visit a booth at the Expo and certify your first world record!</div>`;
    return;
  }
  let html = '';
  CATEGORIES.forEach(cat => {
    const entries = state.book.filter(e => e.catId === cat.id);
    if (entries.length === 0) return;
    html += `<div class="book-section-title">${cat.icon} ${cat.name} (${entries.length})</div>`;
    html += `<div class="book-list">`;
    entries.forEach(e => {
      html += `<div class="book-item">
        <div class="book-item-emoji">${e.emoji}</div>
        <div class="book-item-text">
          <div class="book-item-name">${e.name}</div>
          <div class="book-item-fact">🌍 ${e.fact}</div>
          <div class="book-item-value">You solved: ${e.value}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  });
  content.innerHTML = html;
}

// ============================================================
// NAVIGATION HELPERS
// ============================================================
function goToHub() {
  renderHub();
  showScreen('screen-hub');
  if (checkAllComplete()) {
    setTimeout(() => showScreen('screen-finale'), 300);
  }
}

// ============================================================
// EVENT WIRING
// ============================================================
function wireEvents() {
  wireSymbolPicker();
  document.getElementById('btn-new-game').addEventListener('click', () => {
    state = defaultState();
    saveGame();
    tutIndex = 0;
    renderTutorial();
    showScreen('screen-tutorial');
  });
  document.getElementById('btn-continue').addEventListener('click', () => {
    goToHub();
  });
  document.getElementById('tut-next').addEventListener('click', () => {
    if (tutIndex < TUTORIAL_SLIDES.length - 1) {
      tutIndex++;
      renderTutorial();
    } else {
      state.seenTutorial = true;
      saveGame();
      goToHub();
    }
  });
  document.getElementById('tut-skip').addEventListener('click', () => {
    state.seenTutorial = true;
    saveGame();
    goToHub();
  });
  document.getElementById('btn-open-book').addEventListener('click', () => {
    renderBook();
    showScreen('screen-book');
  });
  document.getElementById('btn-book-back').addEventListener('click', () => {
    showScreen('screen-hub');
  });
  document.getElementById('btn-start-booth').addEventListener('click', () => {
    startBooth(currentBooth);
  });
  document.getElementById('btn-back-hub-1').addEventListener('click', () => {
    showScreen('screen-hub');
  });
  document.getElementById('btn-exit-play').addEventListener('click', () => {
    goToHub();
  });
  document.getElementById('btn-submit-answer').addEventListener('click', () => {
    if (!hasAnswered) checkAnswer();
  });
  document.getElementById('btn-next-question').addEventListener('click', () => {
    nextQuestionOrAdvance();
  });
  document.getElementById('btn-view-book-finale').addEventListener('click', () => {
    renderBook();
    showScreen('screen-book');
  });
  document.getElementById('btn-replay').addEventListener('click', () => {
    state = defaultState();
    saveGame();
    goToHub();
  });
}

// ============================================================
// INIT
// ============================================================
async function init() {
  wireEvents();
  setMascot('mascot-title', 'idle');
  const saved = await loadGame();
  if (saved) {
    state = Object.assign(defaultState(), saved);
    document.getElementById('btn-continue').style.display = 'inline-block';
  }
}
init();
